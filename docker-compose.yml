# AWS Docs Assistant — local dev and EC2 (instance profile for AWS APIs).
#
#   docker compose up -d --build
#   docker compose logs -f backend
#   docker compose --profile ingestion run --rm ingestion --force-reprocess
#
# EC2: API on host localhost only; Streamlit public on :8501 (matches Terraform SG).
# Local: same URLs — http://localhost:8501 and http://127.0.0.1:8000

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_API_URL: http://backend:8000
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    profiles: ["ingestion"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    working_dir: /app
    command: ["python", "run_ingestion.py", "--max-documents", "1"]

volumes:
  huggingface_cache:
