[project]
name = "agentic-aws-docs-assistant"
version = "0.1.0"
description = "Agentic AWS Documentation Assistant — ingestion API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.43.16",
    "fastapi>=0.136.3",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.1",
    "opensearch-py>=3.2.0",
    "pydantic-settings>=2.14.1",
    "requests-aws4auth>=1.3.2",
    "sentence-transformers>=3.4.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.sources]
"app" = "src/app"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
