[project]
name = "agentic-aws-docs-assistant-backend"
version = "0.1.0"
description = "Agentic AWS Documentation Assistant — ingestion & RAG API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.43.16",
    "fastapi>=0.136.3",
    "langgraph>=0.4.0",
    "lxml>=6.1.1",
    "opensearch-py>=3.2.0",
    "pymupdf>=1.25.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.0.0",
    "requests-aws4auth>=1.3.2",
    "sentence-transformers>=3.4.0",
    "structlog>=25.5.0",
    "tavily-python>=0.7.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.8.0",
    "torch>=2.2.0",
    "uvicorn>=0.48.0",
    "watchtower>=3.3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "domain", "generation", "infrastructure", "ingestion", "retrieval", "agent", "api", "main"]

[tool.hatch.build.targets.wheel.sources]
"config" = "src/config"
"domain" = "src/domain"
"infrastructure" = "src/infrastructure"
"ingestion" = "src/ingestion"
"retrieval" = "src/retrieval"
"agent" = "src/agent"
"generation" = "src/generation"
"api" = "src/api"
"main.py" = "src/main.py"

[tool.uv]
package = true

# CPU-only PyTorch for Docker/EC2 (no CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
